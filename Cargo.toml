[package]
name = "portafolio_engine"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
polars = { version = "0.41", features = ["lazy", "csv", "dtype-datetime", "ndarray"] }
ndarray = "0.16"
nalgebra = "0.33"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["full"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
anyhow = "1.0"
dialoguer = "0.11" # Para soporte de consola interactiva auxiliar
rand = "0.8"
rusqlite = { version = "0.31", features = ["bundled"] }
zip = "2.1"
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
open = "5.3"

